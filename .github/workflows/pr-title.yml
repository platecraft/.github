# Reusable PR-title lint: squash-merge titles must be Conventional Commits.
# Standard: platecraft/platecraft-admin docs/organization/adrs/ADR-0004-versioning-and-release-standard.md
name: PR title (reusable)

on:
  workflow_call: {}

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            chore
            ci
            build
            test
            deps
          requireScope: false
          # Release PRs from release-please and promotion/sync merges are exempt.
          ignoreLabels: |
            autorelease: pending
            autorelease: tagged
